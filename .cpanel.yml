---
# Despliegue automático de cPanel (Git Version Control → Deploy HEAD Commit).
#
# IMPORTANTE: reemplace "USUARIO" por su nombre de usuario real de cPanel.
# Para verlo: en cPanel, la barra lateral derecha muestra "Nombre de usuario".
#
# La ruta de destino suele ser:
#   /home/USUARIO/public_html/            → dominio principal (sportrade.co)
#   /home/USUARIO/public_html/subcarpeta/ → subcarpeta o subdominio
deployment:
  tasks:
    - export DEPLOYPATH=/home/USUARIO/public_html/
    - /bin/cp -R index.html $DEPLOYPATH
    - /bin/cp -R css $DEPLOYPATH
    - /bin/cp -R js $DEPLOYPATH
