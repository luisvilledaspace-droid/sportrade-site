---
# Despliegue automatico de cPanel (Git Version Control -> Deploy HEAD Commit).
#
# sportrade.co es un dominio adicional: su document root NO es public_html,
# sino /home/gsbwndpt/sportrade.co (confirmado en cPanel > Dominios).
# public_html pertenece al dominio principal y no debe tocarse.
deployment:
  tasks:
    - /bin/mkdir -p /home/gsbwndpt/sportrade.co/css
    - /bin/mkdir -p /home/gsbwndpt/sportrade.co/js
    - /bin/cp -f index.html /home/gsbwndpt/sportrade.co/index.html
    - /bin/cp -f terminos.html /home/gsbwndpt/sportrade.co/terminos.html
    - /bin/cp -f privacidad.html /home/gsbwndpt/sportrade.co/privacidad.html
    - /bin/cp -f datos.html /home/gsbwndpt/sportrade.co/datos.html
    - /bin/cp -f css/styles.css /home/gsbwndpt/sportrade.co/css/styles.css
    - /bin/cp -f css/legal.css /home/gsbwndpt/sportrade.co/css/legal.css
    - /bin/cp -f js/main.js /home/gsbwndpt/sportrade.co/js/main.js
