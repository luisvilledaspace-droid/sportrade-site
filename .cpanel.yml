---
# Despliegue automático de cPanel (Git Version Control → Deploy HEAD Commit).
#
# Usa $HOME, así que funciona sin editar nada: cPanel lo resuelve al directorio
# de su cuenta (/home/su-usuario).
#
# El sitio se publica en el dominio principal (public_html).
# Para publicarlo en una subcarpeta de prueba, cambie DEPLOYPATH por:
#   $HOME/public_html/nuevo/
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH/css $DEPLOYPATH/js
    - /bin/cp -f index.html $DEPLOYPATH
    - /bin/cp -f css/styles.css $DEPLOYPATH/css/
    - /bin/cp -f js/main.js $DEPLOYPATH/js/
